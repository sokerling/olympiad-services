server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/access/ {
        proxy_pass http://access:8080/;
    }

    location /api/tasks-printing/ {
        proxy_pass http://tasks-printing:8080/;
    }

    location /api/submissions/ {
        proxy_pass http://submissions:8080/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
